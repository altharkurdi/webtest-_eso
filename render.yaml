services:
  - type: web
    name: my-site
    runtime: node
    plan: free
    buildCommand: echo "no build needed"
    startCommand: node server.js
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PATH
        value: panel
    # بۆ هەڵگرتنی هەمیشەیی داتا (پلانی پارەدار) ئەمانە چالاک بکە:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # و ئەم ژینگەیە زیاد بکە: DATA_DIR=/var/data
