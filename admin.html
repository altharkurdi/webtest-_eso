<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b14;--card:#14141f;--bd:#2a2a3c;--tx:#eee;--mu:#9a9ab4;--a:#8b5cf6;--b:#22d3ee}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font-family:'Noto Kufi Arabic',Tahoma,sans-serif;padding:20px;line-height:1.8}
.w{max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:16px}
input,textarea,select{width:100%;padding:11px;margin-bottom:10px;border-radius:12px;border:1px solid var(--bd);background:#0f0f19;color:var(--tx);font:inherit}
button{padding:10px 20px;border-radius:12px;border:1px solid var(--bd);background:#1c1c2c;color:var(--tx);font:inherit;cursor:pointer}
button.p{background:linear-gradient(120deg,var(--a),var(--b));border:0;color:#fff}button.d{color:#f87171}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button.on{border-color:var(--b);color:var(--b)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:.92rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:600px){.g3{grid-template-columns:1fr}}
.mu{color:var(--mu);font-size:.85rem}h3{margin-bottom:12px}.m{color:var(--b);margin-top:8px;font-size:.9rem}
</style>
</head>
<body><div class="w" id="r"></div><script src="/admin.js"></script></body>
</html>
